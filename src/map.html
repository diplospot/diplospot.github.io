<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DiploSpot - Map</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DiploSpot">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="map-container">
    <div class="map-header">
      <a href="./" class="back-link">← Home</a>
      <h1 class="map-title">Map</h1>
    </div>

    <div class="table-wrapper">
      <table id="locations-table">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Country</th>
            <th>Lat/Long</th>
          </tr>
        </thead>
        <tbody id="locations-body">
        </tbody>
      </table>
      <div id="no-locations" class="hidden">No saved locations found.</div>
    </div>
  </div>

  <div id="update-notification" class="hidden">
    <p>New version available</p>
    <button class="refresh-button">Refresh</button>
  </div>

  <script src="map.js"></script>
  <script src="sw-register.js"></script>
</body>
</html>
