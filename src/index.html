<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>DiploSpot</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DiploSpot" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div class="plate">
        <svg class="plate-art" viewBox="0 0 600 300" preserveAspectRatio="none" aria-hidden="true">
          <path
            d="M0,0 L600,0 L600,28 C 470,72 400,82 300,82 C 200,82 130,72 0,28 Z"
            fill="#b7202f"
          ></path>
          <text
            x="300"
            y="48"
            text-anchor="middle"
            fill="#fff"
            font-family="Arial, Helvetica, sans-serif"
            font-weight="800"
            font-size="32"
            letter-spacing="6"
          >
            DIPLOMAT
          </text>
        </svg>
        <input
          type="text"
          id="plate-input"
          maxlength="3"
          minlength="2"
          placeholder="Enter letters..."
          autocomplete="off"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          data-form-type="other"
        />
      </div>
      <p class="instructions">Type the first 2 or 3 letters from a US diplomatic license plate</p>

      <div id="result-container" class="result-card hidden">
        <p id="result-type"></p>
        <p id="result-country"></p>
        <button id="pin-button" class="pin-button" aria-label="Save location">📍</button>
      </div>
    </div>

    <div id="update-notification" class="hidden">
      <p>New version available</p>
      <button class="refresh-button">Refresh</button>
    </div>

    <a href="./map" id="map-link" aria-label="Location map">🗺️</a>
    <button id="info-button" aria-label="About this build">❓</button>

    <div id="info-modal" class="hidden">
      <div class="info-modal-backdrop"></div>
      <div class="info-modal-content">
        <button id="info-modal-close" aria-label="Close">✕</button>
        <h2>About DiploSpot</h2>
        <p>
          <strong>Repository</strong><br /><a
            id="info-repo-link"
            href="#"
            target="_blank"
            rel="noopener"
          ></a>
        </p>
        <p><strong>Local build</strong><br /><span id="info-local-build"></span></p>
        <p>
          <strong>Server build</strong><br /><span id="info-server-build">Checking&hellip;</span>
        </p>
        <p><strong>Status</strong><br /><span id="info-update-status">Checking&hellip;</span></p>
        <div class="button-row">
          <button id="info-force-refresh" class="refresh-button">Force Refresh</button>
          <a href="./logs" class="refresh-button" target="_blank" rel="noopener">View Logs</a>
        </div>
      </div>
    </div>

    <script src="buildinfo.js"></script>
    <script src="ofm_codes.js"></script>
    <script src="app.js"></script>
    <script src="sw-logs.js"></script>
    <script src="info-panel.js"></script>
    <script src="sw-register.js"></script>
  </body>
</html>
