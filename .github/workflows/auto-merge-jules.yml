name: Auto-merge Jules PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-auto-merge:
    # PRs from the jules-invoke API flow are authored as the repo owner
    # (the account whose API key was used), not google-labs-jules[bot] --
    # only the commit itself is co-authored by the bot. So accept either
    # identity, but only for branches that live in this repo: a fork can
    # never satisfy that (forks require push access this repo doesn't
    # grant to anyone but the owner/automation), so it can't be spoofed
    # by an attacker's PR claiming to be from Jules.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'google-labs-jules[bot]' ||
       github.event.pull_request.user.login == 'axemclion')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
